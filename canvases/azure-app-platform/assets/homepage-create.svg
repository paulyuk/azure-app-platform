      <rect x="48.5" y="31.5" width="165" height="136.5" rx="23"/>
    </clipPath>
    <pattern id="selected-create-grid" x="48.5" y="31.5" width="11.9" height="11.4" patternUnits="userSpaceOnUse">
      <path d="M11.9 0H0V11.4" stroke="#CEDEFF" stroke-width="0.7"/>
    </pattern>
  </defs>
  <g id="window">
    <rect x="48.5" y="31.5" width="165" height="136.5" rx="23" fill="#F5F5F5"/>
    <g clip-path="url(#selected-create-window-clip)">
      <rect x="48.5" y="31.5" width="73" height="136.5" fill="url(#selected-create-grid)"/>
      <g id="blueprint-layout" stroke="#5C8DF8" stroke-opacity="0.72" stroke-width="1" stroke-dasharray="3 3">
        <rect x="59.5" y="82.5" width="23.5" height="72" rx="4"/>
        <path d="M121.5 82.5H96C93.8 82.5 92 84.3 92 86.5V110C92 112.2 93.8 114 96 114H121.5"/>
        <path d="M121.5 123H96C93.8 123 92 124.8 92 127V150.5C92 152.7 93.8 154.5 96 154.5H121.5"/>
      </g>
      <g id="finished-layout">
        <rect x="121.5" y="82.5" width="81.5" height="31.5" rx="4" fill="#5C8DF8"/>
        <path d="M131.5 92.5H191M131.5 100.5H175.5" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
        <rect x="121.5" y="123" width="21" height="31.5" rx="4" fill="#CEDEFF"/>
        <rect x="152" y="123" width="51" height="31.5" rx="4" fill="#FFE4B4"/>
        <path d="M160.5 132.5H193M160.5 140.5H185" stroke="#294482" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <path d="M48.5 72H213.5" stroke="#294482" stroke-opacity="0.7" stroke-width="1.1"/>
    </g>
    <path d="M121.5 31.5H190.5C203.2 31.5 213.5 41.8 213.5 54.5V145C213.5 157.7 203.2 168 190.5 168H121.5" stroke="#294482" stroke-opacity="0.8" stroke-width="1.35"/>
    <path d="M121.5 31.5H71.5C58.8 31.5 48.5 41.8 48.5 54.5V145C48.5 157.7 58.8 168 71.5 168H121.5" stroke="#5C8DF8" stroke-opacity="0.8" stroke-width="1.35"/>
    <path d="M121.5 31.5V168" stroke="#5C8DF8" stroke-opacity="0.65" stroke-width="1.1"/>
    <circle cx="166.5" cy="52" r="8" fill="#5C8DF8"/>
    <circle cx="190.5" cy="52" r="7.5" fill="#FFE4B4" stroke="#294482" stroke-width="1"/>
