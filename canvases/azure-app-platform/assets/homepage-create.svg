<svg xmlns="http://www.w3.org/2000/svg" width="512" height="419" viewBox="0 0 237 194" fill="none" role="img" aria-labelledby="selected-create-title selected-create-description">
  <title id="selected-create-title">Create a new app</title>
  <desc id="selected-create-description">An app window transitions from a blueprint grid and dashed layout guides on the left into finished blue and warm-accent interface blocks on the right.</desc>
  <defs>
