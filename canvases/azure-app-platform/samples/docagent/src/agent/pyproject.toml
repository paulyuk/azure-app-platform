[project]
name = "docs-agent5-agent"
version = "0.1.0"
description = "process untrusted documents for a loan agent, redact PII and certify trust for downstream approval processing."
requires-python = "==3.13.*"
dependencies = [
  "azure-identity>=1.25.3,<2",
  "github-copilot-sdk>=1.0.13,<2",
  "python-dotenv>=1,<2",
  "PyYAML>=6.0.3,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
