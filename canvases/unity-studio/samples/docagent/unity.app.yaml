name: docs-agent5
purpose: "process untrusted documents for a loan agent, redact PII and certify trust for downstream approval processing."
capabilities:
  agent:
    path: src/agent
    # Default only; scripts and Studio apply .unity-studio/ports.env when saved.
    interface: http://localhost:8088
    links: [sandbox, gateway]
  sandbox:
    path: src/tools/document-validation
    # Default local simulation; config/runtime.json selects optional ACA sessions.
    interface: subprocess
    links: [agent]
  gateway:
    path: infra-ai-gateway
    interface: configuration
    links: [agent]
