# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: unity-ai-gateway

infra:
  provider: bicep
  path: .
  module: main

hooks:
  preprovision:
    posix:
      shell: sh
      run: bash ./scripts/manage-ai-gateway-lifecycle.sh prepare
    windows:
      shell: pwsh
      run: ./scripts/manage-ai-gateway-lifecycle.ps1 prepare
  postprovision:
    posix:
      shell: sh
      run: bash ./scripts/configure-ai-gateway.sh
    windows:
      shell: pwsh
      run: ./scripts/configure-ai-gateway.ps1
  postdown:
    posix:
      shell: sh
      run: bash ./scripts/manage-ai-gateway-lifecycle.sh cleanup
    windows:
      shell: pwsh
      run: ./scripts/manage-ai-gateway-lifecycle.ps1 cleanup
