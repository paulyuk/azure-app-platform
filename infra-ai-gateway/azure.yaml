# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: unity-ai-gateway

infra:
  provider: bicep
  path: .
  module: main

hooks:
  preprovision:
    shell: sh
    run: bash ./scripts/manage-ai-gateway-lifecycle.sh prepare
  postprovision:
    shell: sh
    run: bash ./scripts/configure-ai-gateway.sh
  postdown:
    shell: sh
    run: bash ./scripts/manage-ai-gateway-lifecycle.sh cleanup
