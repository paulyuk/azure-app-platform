name: Unity plugin portability

on:
  pull_request:
    paths:
      - canvases/unity-studio/**
      - AGENTS.md
      - .github/workflows/unity-plugin-portability.yml
  push:
    branches: [main]
    paths:
      - canvases/unity-studio/**
      - AGENTS.md
      - .github/workflows/unity-plugin-portability.yml

permissions:
  contents: read

jobs:
  portable-payload:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test canvases/unity-studio/plugin-portability.test.mjs
