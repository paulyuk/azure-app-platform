<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 800" width="1500" height="800" preserveAspectRatio="xMidYMid meet" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Sandbox &amp; Gateway Pattern — Minimal + Durability &amp; HITL</title>

  <style>
    :root {
      --bg:#ffffff; --ink:#16202b; --muted:#64748b; --line:#cbd5e1;
      --card:#ffffff; --soft:#f1f5f9; --accent:#d7263d; --accent-soft:#fdf2f4;
      --accent-line:#f0b8c1; --green:#10b981; --green-soft:#ecfdf5;
      --blue:#2563eb; --blue-soft:#eff6ff;
      --amber:#b45309; --amber-soft:#fffbeb;
      --teal:#0f766e; --teal-soft:#f0fdfa; --teal-line:#99f6e4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0f1620; --ink:#e8eef5; --muted:#93a3b6; --line:#33465c;
        --card:#16202b; --soft:#1b2733; --accent:#ff6b81; --accent-soft:#24161c;
        --accent-line:#6d3541; --green:#34d399; --green-soft:#064e3b;
        --blue:#60a5fa; --blue-soft:#1e3a8a;
        --amber:#fbbf24; --amber-soft:#3f2d05;
        --teal:#2dd4bf; --teal-soft:#042f2c; --teal-line:#115e59;
      }
    }
    .bg    { fill: var(--bg); }
    .card  { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .soft  { fill: var(--soft); stroke: var(--line); stroke-width: 1.5; }
    .panel { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .gate  { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.75; }
    .durable{ fill: var(--blue-soft); stroke: var(--blue); stroke-width: 2; }
    .chip  { fill: var(--card); stroke: var(--accent-line); stroke-width: 1.25; }
    .pill  { fill: var(--accent-soft); stroke: var(--accent-line); stroke-width: 1.25; }
    .trig  { fill: var(--soft); stroke: var(--line); stroke-width: 1.25; }
    .egress{ fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.75; }
    .prim  { fill: var(--teal-soft); stroke: var(--teal); stroke-width: 1.75; }
    .primchip { fill: var(--card); stroke: var(--teal-line); stroke-width: 1.1; }
    .t     { fill: var(--ink); }
    .m     { fill: var(--muted); }
    .a     { fill: var(--accent); }
    .b     { fill: var(--blue); }
    .am    { fill: var(--amber); }
    .tl    { fill: var(--teal); }
    .cap   { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; }
    .lbl   { font-size: 12px; font-style: italic; }
    .sub   { font-size: 12.5px; }
    .flow  { fill: none; stroke: var(--accent); stroke-width: 2; }
    .flow-blue { fill: none; stroke: var(--blue); stroke-width: 2; stroke-dasharray: 4 4; }
    .flow-amber { fill: none; stroke: var(--amber); stroke-width: 2; }
    .flow-dash { fill: none; stroke: var(--muted); stroke-width: 1.75; stroke-dasharray: 5 5; }
    .badge { fill: var(--green-soft); stroke: var(--green); stroke-width: 1.2; }
    .badgeT{ fill: var(--green); font-size: 11px; font-weight: 700; }
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 Z" fill="var(--accent)"/>
    </marker>
    <marker id="arw-blue" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 Z" fill="var(--blue)"/>
    </marker>
    <marker id="arw-amber" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 Z" fill="var(--amber)"/>
    </marker>
    <marker id="arw-muted" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 Z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="800"/>

  <!-- Title Section -->
  <text class="t" x="60" y="60" font-size="28" font-weight="700" letter-spacing="-0.4">Sandbox &amp; Gateway Pattern — Minimal + Durability &amp; HITL</text>
  <text class="m" x="60" y="88" font-size="14">Adding Durable Task System (DTS) for turn-level checkpointing &amp; Human-in-the-Loop approvals</text>

  <!-- 1. Triggers -->
  <text class="m cap" x="70" y="150">Triggers</text>
  <rect class="trig" x="70" y="165" width="230" height="60" rx="12"/>
  <text class="t" x="92" y="201" font-size="15" font-weight="650">HTTP REST</text>

  <rect class="trig" x="70" y="245" width="230" height="60" rx="12"/>
  <text class="t" x="92" y="281" font-size="15" font-weight="650">Timer Trigger</text>

  <path class="flow" d="M300,195 L340,255" marker-end="url(#arw)"/>
  <path class="flow-dash" d="M300,275 L340,275" marker-end="url(#arw-muted)"/>

  <!-- 2. Host Compute + DTS -->
  <text class="m cap" x="340" y="150">Durable Host Compute</text>
  <rect class="card" x="340" y="165" width="310" height="255" rx="16"/>
  <rect class="a" x="340" y="165" width="6" height="255" rx="3"/>
  <text class="t" x="365" y="200" font-size="19" font-weight="700">Agent Loop Host</text>

  <rect class="badge" x="365" y="220" width="260" height="32" rx="8"/>
  <text class="badgeT" x="495" y="240" text-anchor="middle">App Service / Functions / ACA</text>

  <rect class="soft" x="365" y="270" width="260" height="130" rx="10"/>
  <text class="t" x="385" y="300" font-size="14" font-weight="650">Durable Agent Loop</text>
  <text class="m sub" x="385" y="325">• Checkpoint at every turn</text>
  <text class="m sub" x="385" y="347">• State recovery on restart</text>
  <text class="m sub" x="385" y="369">• External event wait (HITL)</text>

  <!-- DTS -->
  <rect class="durable" x="340" y="445" width="310" height="90" rx="16"/>
  <text class="b" x="365" y="480" font-size="16" font-weight="700">★ DTS / Durable Task Scheduler</text>
  <text class="m sub" x="365" y="503">Turn-level checkpointing · pause &amp; resume</text>
  <path class="flow-blue" d="M495,420 L495,445" marker-end="url(#arw-blue)"/>

  <!-- HITL approval request routed through AI Gateway -->
  <path class="flow-blue" d="M650,470 L780,530" marker-end="url(#arw-blue)"/>
  <text class="m lbl" x="700" y="463" font-size="11">HITL approval request (via Gateway)</text>

  <!-- Approval event returns to DTS via the same egress/gateway path -->
  <path class="flow-blue" d="M780,590 C 690,660 550,660 495,535" marker-end="url(#arw-blue)"/>
  <text class="m lbl" x="565" y="648" font-size="11">approval event</text>

  <!-- Flow: Host Compute -> ACA Sandboxes -->
  <path class="flow" d="M495,165 L495,105 L890,105 L890,165" marker-end="url(#arw)"/>
  <text class="m lbl" x="695" y="95" text-anchor="middle">Tool execution (isolated)</text>

  <!-- Flow: Host Compute -> AI Gateway -->
  <path class="flow" d="M650,310 L780,310" marker-end="url(#arw)"/>
  <text class="m lbl" x="715" y="297" text-anchor="middle" font-size="11">prompts</text>

  <!-- 3. ACA Sandboxes -->
  <text class="m cap" x="780" y="150">Tool Execution &amp; Egress</text>
  <rect class="panel" x="780" y="165" width="340" height="100" rx="16"/>
  <text class="a" x="805" y="198" font-size="17" font-weight="700">★ ACA Sandboxes</text>
  <rect class="pill" x="805" y="215" width="160" height="24" rx="12"/>
  <text class="a" x="885" y="231" font-size="11" font-weight="700" text-anchor="middle">PII Boundary Enforced</text>

  <path class="flow-amber" d="M950,265 L950,283" marker-end="url(#arw-amber)"/>
  <rect class="egress" x="780" y="283" width="340" height="50" rx="14"/>
  <text class="am" x="805" y="313" font-size="14" font-weight="700">🔒 Secure Egress Proxy</text>

  <path class="flow-amber" d="M950,333 L950,351" marker-end="url(#arw-amber)"/>
  <rect class="card" x="780" y="351" width="340" height="50" rx="14"/>
  <text class="t" x="805" y="381" font-size="14" font-weight="650">Connectors (Teams / Email / M365)</text>

  <!-- 4. AI Gateway -->
  <text class="m cap" x="780" y="440">Egress &amp; Model Governance</text>
  <rect class="gate" x="780" y="455" width="340" height="150" rx="16"/>
  <text class="a" x="805" y="485" font-size="17" font-weight="700">AI Gateway (APIM)</text>

  <rect class="chip" x="805" y="500" width="140" height="36" rx="8"/>
  <text class="t" x="875" y="523" font-size="11.5" font-weight="650" text-anchor="middle">Model Routing</text>

  <rect class="chip" x="955" y="500" width="140" height="36" rx="8"/>
  <text class="t" x="1025" y="523" font-size="11.5" font-weight="650" text-anchor="middle">Tools</text>

  <rect class="chip" x="805" y="544" width="140" height="36" rx="8"/>
  <text class="t" x="875" y="567" font-size="11.5" font-weight="650" text-anchor="middle">Policies</text>

  <rect class="chip" x="955" y="544" width="140" height="36" rx="8"/>
  <text class="t" x="1025" y="567" font-size="11.5" font-weight="650" text-anchor="middle">Enforcement</text>

  <!-- Shared Primitives bottom bar -->
  <rect class="prim" x="60" y="710" width="1380" height="60" rx="14"/>
  <text class="tl" x="85" y="746" font-size="14.5" font-weight="700">★ Shared Primitives</text>

  <rect class="primchip" x="290" y="725" width="90" height="30" rx="8"/>
  <text class="t" x="335" y="745" font-size="11.5" font-weight="650" text-anchor="middle">Auth</text>
  <rect class="primchip" x="390" y="725" width="90" height="30" rx="8"/>
  <text class="t" x="435" y="745" font-size="11.5" font-weight="650" text-anchor="middle">OTEL</text>
  <rect class="primchip" x="490" y="725" width="90" height="30" rx="8"/>
  <text class="t" x="535" y="745" font-size="11.5" font-weight="650" text-anchor="middle">Audit</text>
  <text class="m sub" x="600" y="745">— shared by every tier of this pattern, regardless of host compute choice</text>

</svg>
