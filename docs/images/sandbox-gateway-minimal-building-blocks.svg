<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 730" width="1400" height="730" preserveAspectRatio="xMidYMid meet" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Sandboxes + AI Gateway Minimal Pattern — Protecting the Hands from Multiple Brains</title>
  <desc>Start with 1 agent and plan for 2+ agents or Hosted Skills: all tool calls (including sandboxed tools) and model calls route behind AI Gateway, while the ACA Sandboxes egress proxy bounds outbound network access.</desc>

  <style>
    :root {
      --bg:#ffffff; --ink:#16202b; --muted:#64748b; --line:#cbd5e1;
      --card:#ffffff; --soft:#f1f5f9; --accent:#486581; --accent-soft:#f3f6f9;
      --accent-line:#bcccdc; --green:#567060; --green-soft:#f2f5f2;
      --amber:#b45309; --amber-soft:#fffbeb;
      --teal:#0f766e; --teal-soft:#f0fdfa; --teal-line:#99f6e4;
      --indigo:#4f46e5; --indigo-soft:#eef2ff; --indigo-line:#c7d2fe;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0f1620; --ink:#e8eef5; --muted:#93a3b6; --line:#33465c;
        --card:#16202b; --soft:#1b2733; --accent:#9fb3c8; --accent-soft:#1b2936;
        --accent-line:#486581; --green:#a3b8a7; --green-soft:#1b2b23;
        --amber:#fbbf24; --amber-soft:#3f2d05;
        --teal:#2dd4bf; --teal-soft:#042f2c; --teal-line:#115e59;
        --indigo:#a5b4fc; --indigo-soft:#1e1b4b; --indigo-line:#3730a3;
      }
    }
    .bg    { fill: var(--bg); }
    .card  { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .soft  { fill: var(--soft); stroke: var(--line); stroke-width: 1.5; }
    .panel { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .gate  { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .chip  { fill: var(--card); stroke: var(--accent-line); stroke-width: 1.25; }
    .pill  { fill: var(--accent-soft); stroke: var(--accent-line); stroke-width: 1.25; }
    .trig  { fill: var(--soft); stroke: var(--line); stroke-width: 1.25; }
    .egress{ fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.75; }
    .prim  { fill: var(--soft); stroke: var(--line); stroke-width: 1; }
    .primchip { fill: var(--card); stroke: var(--line); stroke-width: 1; }
    .primchip + text { fill: var(--muted); }
    .addon { fill: var(--indigo-soft); stroke: var(--indigo); stroke-width: 1.75; stroke-dasharray: 6 5; }
    .t     { fill: var(--ink); }
    .m     { fill: var(--muted); }
    .a     { fill: var(--accent); }
    .am    { fill: var(--amber); }
    .ig    { fill: var(--indigo); }
    .tl    { fill: var(--muted); }
    .cap   { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; }
    .lbl   { font-size: 12px; font-style: italic; }
    .sub   { font-size: 12.5px; }
    .flow  { fill: none; stroke: var(--accent); stroke-width: 2; }
    .flow-amber { fill: none; stroke: var(--amber); stroke-width: 2; }
    .flow-dash { fill: none; stroke: var(--indigo); stroke-width: 1.75; stroke-dasharray: 5 5; }
    .badge { fill: var(--soft); stroke: var(--line); stroke-width: 1; }
    .badgeT{ fill: var(--muted); font-size: 11px; font-weight: 500; }
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 Z" fill="var(--accent)"/>
    </marker>
    <marker id="arw-amber" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 Z" fill="var(--amber)"/>
    </marker>
    <marker id="arw-indigo" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 Z" fill="var(--indigo)"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="730"/>

  <!-- Title -->
  <text class="t" x="60" y="58" font-size="27" font-weight="700" letter-spacing="-0.4">Sandboxes + AI Gateway Minimal — Protecting the Hands from Multiple Brains</text>
  <text class="m" x="60" y="86" font-size="14">Start with 1 agent, plan for 2+ agents or Hosted Skills · All tool calls (including sandboxed tools) &amp; model calls sit behind AI Gateway</text>

  <!-- Column A: Triggers -->
  <text class="m cap" x="60" y="150">Triggers</text>
  <rect class="trig" x="60" y="165" width="190" height="60" rx="12"/>
  <text class="t" x="80" y="201" font-size="15" font-weight="650">HTTP REST</text>

  <rect class="trig" x="60" y="245" width="190" height="60" rx="12"/>
  <text class="t" x="80" y="281" font-size="15" font-weight="650">Timer</text>

  <rect class="trig" x="60" y="325" width="190" height="60" rx="12"/>
  <text class="t" x="80" y="361" font-size="15" font-weight="650">Connectors events</text>

  <path class="flow" d="M250,195 L290,235" marker-end="url(#arw)"/>
  <path class="flow" d="M250,275 L290,275" marker-end="url(#arw)"/>
  <path class="flow" d="M250,355 L290,340" marker-end="url(#arw)"/>

  <!-- Column B: Multiple Brains (Start with 1, scale to 2+) -->
  <text class="m cap" x="290" y="150">Multiple Brains (Start with 1 → Scale to 2+)</text>
  <rect class="card" x="290" y="165" width="290" height="245" rx="16"/>
  <text class="t" x="315" y="198" font-size="18.5" font-weight="700">Agent (Brain 1)</text>

  <rect class="badge" x="315" y="214" width="240" height="30" rx="8"/>
  <text class="badgeT" x="435" y="233" text-anchor="middle">FHA / ACA / App Service / Functions</text>

  <rect class="soft" x="315" y="258" width="240" height="132" rx="10"/>
  <text class="t" x="333" y="286" font-size="13.5" font-weight="650">Agent control loop</text>
  <text class="m sub" x="333" y="311">All tool &amp; model calls via gateway</text>
  <text class="m sub" x="333" y="333">Never calls sandbox directly</text>
  <text class="m sub" x="333" y="355">Checks result contract &amp; policy</text>

  <!-- Planned 2nd Brain / Hosted Skill -->
  <rect class="addon" x="290" y="430" width="290" height="150" rx="16"/>
  <text class="ig" x="315" y="462" font-size="16" font-weight="700">+ 2nd Agent / Hosted Skill</text>
  <text class="m sub" x="315" y="488">Additional brains calling the</text>
  <text class="m sub" x="315" y="510">same shared sandboxed tool</text>
  <text class="m sub" x="315" y="532">&amp; model deployments</text>
  <text class="ig" x="315" y="560" font-size="11.5" font-weight="650">Protected by the same AI Gateway</text>

  <!-- Brains -> AI Gateway -->
  <path class="flow" d="M580,285 L650,285" marker-end="url(#arw)"/>
  <text class="m lbl" x="615" y="272" text-anchor="middle">tool &amp; model</text>
  <path class="flow" d="M650,320 L580,320" marker-end="url(#arw)"/>
  <text class="m lbl" x="615" y="340" text-anchor="middle">checked result</text>
  <path class="flow-dash" d="M580,505 L620,505 L620,420 L650,420" marker-end="url(#arw-indigo)"/>

  <!-- Column C: AI Gateway (Protecting the Hands from Multiple Brains) -->
  <text class="m cap" x="650" y="150">Inbound Governance Seam</text>
  <rect class="gate" x="650" y="165" width="310" height="245" rx="16"/>
  <text class="a" x="675" y="200" font-size="18.5" font-weight="700">★ AI Gateway</text>
  <text class="t" x="675" y="224" font-size="12.5" font-weight="650">Protects the hands from multiple brains</text>
  <text class="m" x="675" y="245" font-size="11.5">All tool calls (including sandboxed tools)</text>
  <text class="m" x="675" y="262" font-size="11.5">and model calls route through here.</text>

  <rect class="chip" x="675" y="285" width="125" height="40" rx="8"/>
  <text class="t" x="737" y="310" font-size="11.5" font-weight="650" text-anchor="middle">Model Routing</text>

  <rect class="chip" x="810" y="285" width="125" height="40" rx="8"/>
  <text class="t" x="872" y="310" font-size="11.5" font-weight="650" text-anchor="middle">MCP &amp; Tools</text>

  <rect class="chip" x="675" y="338" width="125" height="40" rx="8"/>
  <text class="t" x="737" y="363" font-size="11.5" font-weight="650" text-anchor="middle">Policies</text>

  <rect class="chip" x="810" y="338" width="125" height="40" rx="8"/>
  <text class="t" x="872" y="363" font-size="11.5" font-weight="650" text-anchor="middle">Enforcement</text>

  <!-- AI Gateway -> ACA Sandboxes (Top Right) -->
  <path class="flow" d="M960,235 L1030,235" marker-end="url(#arw)"/>
  <text class="m lbl" x="995" y="222" text-anchor="middle">governed tool</text>
  <path class="flow" d="M1030,268 L960,268" marker-end="url(#arw)"/>
  <text class="m lbl" x="995" y="286" text-anchor="middle">result</text>

  <!-- AI Gateway -> Remote Model (Bottom Right) -->
  <path class="flow" d="M960,375 L1030,505" marker-end="url(#arw)"/>
  <text class="m lbl" x="985" y="458" text-anchor="end">governed model</text>

  <!-- Column D (Top): ACA Sandboxes (The Hands) + Egress Proxy -->
  <text class="m cap" x="1030" y="150">The Hands (Behind Gateway + Egress Proxy)</text>
  <rect class="panel" x="1030" y="165" width="310" height="100" rx="16"/>
  <text class="a" x="1055" y="198" font-size="17" font-weight="700">★ ACA Sandboxes</text>
  <rect class="pill" x="1055" y="215" width="135" height="24" rx="12"/>
  <text class="a" x="1122" y="231" font-size="11" font-weight="700" text-anchor="middle">Scoped tool execution</text>
  <rect class="pill" x="1198" y="215" width="120" height="24" rx="12"/>
  <text class="a" x="1258" y="231" font-size="11" font-weight="700" text-anchor="middle">create · exec · delete</text>

  <rect class="egress" x="1030" y="283" width="310" height="50" rx="14"/>
  <text class="am" x="1055" y="313" font-size="13.5" font-weight="700">Sandboxes egress proxy · default deny</text>

  <rect class="card" x="1030" y="351" width="310" height="50" rx="14"/>
  <text class="t" x="1055" y="381" font-size="13.5" font-weight="650">Check result contract + policy</text>

  <!-- Column D (Bottom): Remote Model -->
  <rect class="card" x="1030" y="470" width="310" height="110" rx="16"/>
  <text class="t" x="1185" y="518" font-size="17" font-weight="700" text-anchor="middle">Remote model</text>
  <text class="m sub" x="1185" y="544" text-anchor="middle">gpt-latest · routed &amp; rate-limited</text>

  <text class="m" x="290" y="618" font-size="12.5">AI Gateway governs inbound access from 1→2+ brains to the hands and models; the Sandboxes egress proxy governs outbound calls from the hands.</text>

  <!-- Shared Primitives: full-width bottom bar -->
  <rect class="prim" x="60" y="640" width="1280" height="60" rx="14"/>
  <text class="tl" x="85" y="676" font-size="13" font-weight="500">Shared Primitives</text>

  <rect class="primchip" x="290" y="655" width="90" height="30" rx="8"/>
  <text class="t" x="335" y="675" font-size="11.5" font-weight="650" text-anchor="middle">Auth</text>
  <rect class="primchip" x="390" y="655" width="90" height="30" rx="8"/>
  <text class="t" x="435" y="675" font-size="11.5" font-weight="650" text-anchor="middle">OTEL</text>
  <rect class="primchip" x="490" y="655" width="90" height="30" rx="8"/>
  <text class="t" x="535" y="675" font-size="11.5" font-weight="650" text-anchor="middle">Audit</text>
  <text class="m sub" x="600" y="675">— recommended cross-cutting concerns; not all provisioned by this starter</text>

</svg>
