<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" preserveAspectRatio="xMidYMid meet" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Sandboxes Minimal Pattern — 1 Agent with Sandboxes Egress Proxy</title>
  <desc>The minimal sandbox pattern for a single agent calling sandboxed tools. ACA Sandboxes isolates untrusted tool execution and enforces outbound network safety through the Sandboxes egress proxy.</desc>

  <style>
    :root {
      --bg:#ffffff; --ink:#16202b; --muted:#64748b; --line:#cbd5e1;
      --card:#ffffff; --soft:#f1f5f9; --accent:#486581; --accent-soft:#f3f6f9;
      --accent-line:#bcccdc; --green:#567060; --green-soft:#f2f5f2;
      --amber:#b45309; --amber-soft:#fffbeb;
      --teal:#0f766e; --teal-soft:#f0fdfa; --teal-line:#99f6e4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0f1620; --ink:#e8eef5; --muted:#93a3b6; --line:#33465c;
        --card:#16202b; --soft:#1b2733; --accent:#9fb3c8; --accent-soft:#1b2936;
        --accent-line:#486581; --green:#a3b8a7; --green-soft:#1b2b23;
        --amber:#fbbf24; --amber-soft:#3f2d05;
        --teal:#2dd4bf; --teal-soft:#042f2c; --teal-line:#115e59;
      }
    }
    .bg    { fill: var(--bg); }
    .card  { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .soft  { fill: var(--soft); stroke: var(--line); stroke-width: 1.5; }
    .panel { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .pill  { fill: var(--accent-soft); stroke: var(--accent-line); stroke-width: 1.25; }
    .trig  { fill: var(--soft); stroke: var(--line); stroke-width: 1.25; }
    .egress{ fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.75; }
    .prim  { fill: var(--soft); stroke: var(--line); stroke-width: 1; }
    .primchip { fill: var(--card); stroke: var(--line); stroke-width: 1; }
    .primchip + text { fill: var(--muted); }
    .t     { fill: var(--ink); }
    .m     { fill: var(--muted); }
    .a     { fill: var(--accent); }
    .am    { fill: var(--amber); }
    .tl    { fill: var(--muted); }
    .cap   { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; }
    .lbl   { font-size: 12px; font-style: italic; }
    .sub   { font-size: 12.5px; }
    .flow  { fill: none; stroke: var(--accent); stroke-width: 2; }
    .flow-amber { fill: none; stroke: var(--amber); stroke-width: 2; }
    .badge { fill: var(--soft); stroke: var(--line); stroke-width: 1; }
    .badgeT{ fill: var(--muted); font-size: 11px; font-weight: 500; }
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 Z" fill="var(--accent)"/>
    </marker>
    <marker id="arw-amber" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 Z" fill="var(--amber)"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="560"/>

  <!-- Title -->
  <text class="t" x="60" y="58" font-size="27" font-weight="700" letter-spacing="-0.4">Sandboxes Minimal Pattern — 1 Brain &amp; Sandboxed Hands</text>
  <text class="m" x="60" y="86" font-size="14">Single agent calling sandboxed tools · ACA Sandboxes execution boundary + Sandboxes egress proxy</text>

  <!-- Column A: Triggers -->
  <text class="m cap" x="60" y="150">Triggers</text>
  <rect class="trig" x="60" y="165" width="220" height="60" rx="12"/>
  <text class="t" x="80" y="201" font-size="15" font-weight="650">HTTP REST</text>

  <rect class="trig" x="60" y="245" width="220" height="60" rx="12"/>
  <text class="t" x="80" y="281" font-size="15" font-weight="650">Timer</text>

  <rect class="trig" x="60" y="325" width="220" height="60" rx="12"/>
  <text class="t" x="80" y="361" font-size="15" font-weight="650">Connectors events</text>

  <path class="flow" d="M280,195 L320,240" marker-end="url(#arw)"/>
  <path class="flow" d="M280,275 L320,275" marker-end="url(#arw)"/>
  <path class="flow" d="M280,355 L320,355" marker-end="url(#arw)"/>

  <!-- Column B: Single Agent (The Brain) -->
  <text class="m cap" x="320" y="150">Single Brain (1 Agent)</text>
  <rect class="card" x="320" y="165" width="320" height="255" rx="16"/>
  <text class="t" x="345" y="200" font-size="19" font-weight="700">Agent</text>

  <rect class="badge" x="345" y="220" width="270" height="32" rx="8"/>
  <text class="badgeT" x="480" y="240" text-anchor="middle">FHA / ACA / App Service / Functions</text>

  <rect class="soft" x="345" y="270" width="270" height="130" rx="10"/>
  <text class="t" x="365" y="300" font-size="14" font-weight="650">Single-agent control loop</text>
  <text class="m sub" x="365" y="325">1 agent owns the sandboxed tool</text>
  <text class="m sub" x="365" y="347">Dispatches untrusted work to sandbox</text>
  <text class="m sub" x="365" y="369">Checks bounded result &amp; continues</text>

  <!-- Flow: Single Agent <-> ACA Sandboxes -->
  <path class="flow" d="M640,210 L740,210" marker-end="url(#arw)"/>
  <text class="m lbl" x="690" y="198" text-anchor="middle">create → exec → delete</text>
  <path class="flow" d="M740,245 L640,245" marker-end="url(#arw)"/>
  <text class="m lbl" x="690" y="265" text-anchor="middle">result</text>

  <!-- Column C: ACA Sandboxes (The Hands) + Egress Proxy -->
  <text class="m cap" x="740" y="150">The Hands (Sandboxed Tool + Egress Proxy)</text>
  <rect class="panel" x="740" y="165" width="340" height="100" rx="16"/>
  <text class="a" x="765" y="198" font-size="17" font-weight="700">★ ACA Sandboxes</text>
  <rect class="pill" x="765" y="215" width="160" height="24" rx="12"/>
  <text class="a" x="845" y="231" font-size="11" font-weight="700" text-anchor="middle">Scoped tool execution</text>
  <rect class="pill" x="935" y="215" width="125" height="24" rx="12"/>
  <text class="a" x="997" y="231" font-size="11" font-weight="700" text-anchor="middle">create · exec · delete</text>

  <rect class="egress" x="740" y="283" width="340" height="50" rx="14"/>
  <text class="am" x="765" y="313" font-size="14" font-weight="700">Sandboxes egress proxy · default deny</text>

  <rect class="card" x="740" y="351" width="340" height="50" rx="14"/>
  <text class="t" x="765" y="381" font-size="14" font-weight="650">Check result contract + policy</text>

  <!-- Outbound Egress Arrow -->
  <path class="flow-amber" d="M1080,308 L1135,308" marker-end="url(#arw-amber)"/>
  <rect class="card" x="1135" y="278" width="205" height="60" rx="12"/>
  <text class="t" x="1237" y="305" font-size="13.5" font-weight="700" text-anchor="middle">Allowed egress only</text>
  <text class="m sub" x="1237" y="324" text-anchor="middle">Explicit allowlist</text>

  <!-- Shared Primitives bottom bar -->
  <rect class="prim" x="60" y="460" width="1280" height="60" rx="14"/>
  <text class="tl" x="85" y="496" font-size="13" font-weight="500">Shared Primitives</text>

  <rect class="primchip" x="290" y="475" width="90" height="30" rx="8"/>
  <text class="t" x="335" y="495" font-size="11.5" font-weight="650" text-anchor="middle">Auth</text>
  <rect class="primchip" x="390" y="475" width="90" height="30" rx="8"/>
  <text class="t" x="435" y="495" font-size="11.5" font-weight="650" text-anchor="middle">OTEL</text>
  <rect class="primchip" x="490" y="475" width="90" height="30" rx="8"/>
  <text class="t" x="535" y="495" font-size="11.5" font-weight="650" text-anchor="middle">Audit</text>
  <text class="m sub" x="600" y="495">— for 1 agent calling sandboxed tools, ACA Sandboxes + its egress proxy keep execution safe</text>
</svg>
